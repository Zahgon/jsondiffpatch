name: Rust CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
